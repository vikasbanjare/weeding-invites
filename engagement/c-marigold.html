<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Avinash &amp; Divya — Ivory Marigold</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--wine:#5a0f33;--ivory:#fbf0dc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
#frame{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f6e8d0}
#stage{position:absolute;inset:0;transform-origin:50% 35%}
#paper{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,#fff6e4,#f3e2c6 70%,#ecd6b4)}
#grain{position:absolute;inset:0;opacity:.28;mix-blend-mode:multiply;pointer-events:none}
svg.full{position:absolute;inset:0;width:1080px;height:1920px;overflow:visible}
.abs{position:absolute;left:0;width:1080px;text-align:center}
.eyebrow{font:400 20px/1 'Jost';letter-spacing:.6em;text-transform:uppercase;color:var(--wine);padding-left:.6em}
.deva{font:400 56px/1 'Tiro Devanagari Hindi';color:var(--wine)}
.mask{position:absolute;left:0;width:1080px;overflow:hidden;text-align:center;height:250px}
.nm{display:inline-block;font:italic 300 232px/1.05 'Cormorant Garamond';color:var(--ivory);letter-spacing:-.01em;white-space:nowrap;will-change:transform;text-shadow:0 6px 40px rgba(70,0,40,.35)}
.amp{font:italic 300 90px/1 'Cormorant Garamond';color:#ffe2a6}
.cap{font:400 30px/1 'Marcellus';letter-spacing:.5em;padding-left:.5em;color:var(--wine);text-transform:uppercase}
.big{font:300 250px/1 'Cormorant Garamond';font-variant-numeric:lining-nums;color:var(--wine);letter-spacing:-.03em}
.side{font:400 26px/1.7 'Jost';letter-spacing:.42em;text-transform:uppercase;color:var(--wine)}
.time{font:400 34px/1 'Marcellus';letter-spacing:.3em;padding-left:.3em;color:var(--wine)}
.ven{font:500 70px/1 'Cormorant Garamond';color:var(--wine)}
.city{font:400 22px/1 'Jost';letter-spacing:.6em;padding-left:.6em;color:#b3441f;text-transform:uppercase}
.rv{will-change:transform,opacity,filter}
.mote{position:absolute;border-radius:50%;background:radial-gradient(circle,#ffd98a,rgba(255,170,70,0) 70%)}
#sweep{position:absolute;top:140px;left:-400px;width:240px;height:960px;mix-blend-mode:overlay;filter:blur(14px);background:linear-gradient(90deg,transparent,rgba(255,250,235,.95),transparent)}
</style></head><body>
<div id="frame"><div id="paper"></div><div id="stage">
 <svg class="full" viewBox="0 0 1080 1920">
  <defs>
   <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c1747"/><stop offset=".42" stop-color="#d23a4b"/><stop offset=".78" stop-color="#f2762e"/><stop offset="1" stop-color="#f7b231"/></linearGradient>
   <radialGradient id="sg" cx="50%" cy="100%" r="100%"><stop offset="0" stop-color="#fff3c9"/><stop offset=".6" stop-color="#ffd27a"/><stop offset="1" stop-color="#f9a63a"/></radialGradient>
   <clipPath id="ac"><path d="M110 1110V560C110 316 300 130 540 130C780 130 970 316 970 560V1110Z"/></clipPath>
   <clipPath id="arise"><rect id="ariseR" x="0" y="1110" width="1080" height="0"/></clipPath>
   <pattern id="jl" width="90" height="90" patternUnits="userSpaceOnUse"><g fill="none" stroke="#fbe6bf" stroke-width="1.1"><rect x="15" y="15" width="60" height="60" transform="rotate(45 45 45)"/><rect x="15" y="15" width="60" height="60"/><circle cx="45" cy="45" r="8"/></g></pattern>
   <linearGradient id="jfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".6" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
   <mask id="jmk" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920"><rect x="100" y="120" width="880" height="1000" fill="url(#jfade)"/></mask>
  </defs>
  <g clip-path="url(#arise)">
   <g clip-path="url(#ac)">
    <rect x="100" y="120" width="880" height="1000" fill="url(#ag)"/>
    <g mask="url(#jmk)"><rect id="jr" x="0" y="0" width="1300" height="1300" fill="url(#jl)" opacity=".9"/></g>
    <g id="sun" transform="translate(540 1110)">
      <g id="rays" stroke="#fff1c8" stroke-width="2.4" stroke-linecap="round" opacity=".55"></g>
      <circle r="190" fill="url(#sg)"/>
      <circle r="150" fill="none" stroke="#fff6dc" stroke-width="1.4" opacity=".7"/>
    </g>
   </g>
  </g>
  <path id="a1" pathLength="1" fill="none" stroke="#5a0f33" stroke-width="2.4" d="M110 1110V560C110 316 300 130 540 130C780 130 970 316 970 560V1110"/>
  <path id="a2" pathLength="1" fill="none" stroke="#5a0f33" stroke-width="1.2" opacity=".7" d="M80 1140V560C80 296 285 100 540 100C795 100 1000 296 1000 560V1140Z"/>
  <path id="base" pathLength="1" fill="none" stroke="#5a0f33" stroke-width="2.4" d="M70 1110H1010"/>
  <path id="sep1" pathLength="1" fill="none" stroke="#5a0f33" stroke-width="1.4" d="M130 1520H950"/>
  <rect x="34" y="34" width="1012" height="1852" fill="none" stroke="#5a0f33" stroke-width="1.2" opacity=".55" id="frm"/>
 </svg>

 <div class="abs eyebrow rv" id="eb" style="top:56px">With the blessings of our families</div>

 <div class="mask" style="top:290px"><div class="nm" id="n1">Avinash</div></div>
 <div class="abs amp rv" id="amp" style="top:545px">&amp;</div>
 <div class="mask" style="top:560px"><div class="nm" id="n2">Divya</div></div>

 <div class="abs deva rv" id="dv" style="top:1155px">सगाई</div>
 <div class="abs cap rv" id="cap" style="top:1245px">Engagement Ceremony</div>

 <div class="abs big rv" id="d22" style="top:1290px;left:60px;width:520px;text-align:right;line-height:1">22</div>
 <div class="abs side rv" id="side" style="top:1345px;left:620px;width:420px;text-align:left">Sunday<br>November<br>2026</div>
 <div class="abs time rv" id="time" style="top:1562px">11:00 AM onwards</div>
 <div class="abs ven rv" id="ven" style="top:1660px">Aas Manglam</div>
 <div class="abs city rv" id="city" style="top:1752px">Korba</div>
 <div id="motes"></div><div id="sweep"></div>
</div>
<svg id="grain" width="1080" height="1920"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .25 0 0 0 .8 0"/></filter><rect width="100%" height="100%" filter="url(#nz)"/></svg>
</div>
<script>
const DUR_V=7.5,clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,s,d)=>clamp((t-s)/d),eO=x=>1-Math.pow(1-x,3),eO5=x=>1-Math.pow(1-x,5),eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,$=id=>document.getElementById(id);
let sd=9;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
(()=>{let h='';for(let i=0;i<24;i++){const a=(180+i*7.5)*Math.PI/180;h+=`<line x1="${Math.cos(a)*215}" y1="${Math.sin(a)*215}" x2="${Math.cos(a)*(i%2?270:310)}" y2="${Math.sin(a)*(i%2?270:310)}"/>`}$('rays').innerHTML=h})();
const motes=[];for(let i=0;i<30;i++){const d=document.createElement('div');d.className='mote';const z=4+rnd()*9;d.style.width=d.style.height=z+'px';$('motes').appendChild(d);motes.push({d,x:rnd()*1080,y0:rnd()*2100,sp:12+rnd()*26,ph:rnd()*6.28,sw:8+rnd()*16,b:.35+rnd()*.5})}
const RV=[['eb',.3,.8,12,4],['dv',3.9,.8,20,6],['cap',4.1,.9,0,0],['d22',4.4,1.0,70,10],['side',4.9,.9,24,6],['time',5.4,.8,20,5],['ven',5.8,.9,26,6],['city',6.2,.8,14,4]];
function draw(el,p){el.setAttribute('stroke-dasharray','1 1');el.setAttribute('stroke-dashoffset',(1-p).toFixed(4))}
function setV(t){t=clamp(t,0,DUR_V);
 const cp=eO(P(t,0,DUR_V));$('stage').style.transform=`scale(${1+.05*(1-cp)})`;
 const rise=eIO(P(t,.15,1.6));$('ariseR').setAttribute('y',1140-1040*rise);$('ariseR').setAttribute('height',1040*rise+0.001);
 draw($('a1'),eIO(P(t,.2,1.6)));draw($('a2'),eIO(P(t,.5,1.6)));draw($('base'),eIO(P(t,.3,1.2)));draw($('sep1'),eIO(P(t,5.0,1.2)));
 $('frm').style.opacity=.55*eO(P(t,.1,1.2));
 const sp=eO5(P(t,1.2,1.6));$('sun').setAttribute('transform',`translate(540 ${1110+(1-sp)*200})`);$('rays').setAttribute('transform',`rotate(${t*2})`);
 $('jr').setAttribute('transform',`translate(${-t*6} ${t*4})`);
 RV.forEach(([id,s,d,r,b])=>{const e=$(id),p=eO(P(t,s,d));e.style.opacity=p;e.style.transform=`translateY(${(1-p)*r}px)`;e.style.filter=b?`blur(${(1-p)*b}px)`:'none'});
 $('cap').style.letterSpacing=(.5+(1-eO5(P(t,4.1,1.4)))*.6)+'em';
 const n1=eO5(P(t,2.0,1.0)),n2=eO5(P(t,3.0,1.0));
 $('n1').style.transform=`translateY(${(1-n1)*260}px) skewY(${(1-n1)*-4}deg)`;$('n2').style.transform=`translateY(${(1-n2)*260}px) skewY(${(1-n2)*-4}deg)`;
 const a=eO(P(t,2.7,.6));$('amp').style.opacity=a;$('amp').style.transform=`scale(${.6+.4*a}) rotate(${(1-a)*-40}deg)`;
 const sw=eIO(P(t,5.8,1.5));$('sweep').style.transform=`translateX(${sw*1800}px) skewX(-18deg)`;$('sweep').style.opacity=sw>0&&sw<1?1:0;
 const fm=eO(P(t,.8,1.5));motes.forEach(m=>{const y=((m.y0-m.sp*t)%2200+2200)%2200-60;m.d.style.transform=`translate(${m.x+Math.sin(t*.7+m.ph)*m.sw}px,${y}px)`;m.d.style.opacity=m.b*(.5+.5*Math.sin(t*1.7+m.ph))*fm})}
window.setV=setV;window.DUR_V=DUR_V;setV(DUR_V);
</script></body></html>
