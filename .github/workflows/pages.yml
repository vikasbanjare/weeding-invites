name: Deploy invitation preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p public/assets/fonts public/assets/scenes public/assets/previews public/assets/films
          cp showroom.css designs.js invitation.html invitation.css invitation.js royal-gate.css signature-invites.css index.html home.css home.js studio.html styles.css script.js palace.html palace.css palace.js builder.html builder.css builder.js favicon.svg public/
          cp assets/*.webp public/assets/
          cp assets/films/*.mp4 public/assets/films/
          cp assets/scenes/*.svg public/assets/scenes/
          cp assets/previews/*.webp public/assets/previews/
          cp assets/fonts/* public/assets/fonts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
